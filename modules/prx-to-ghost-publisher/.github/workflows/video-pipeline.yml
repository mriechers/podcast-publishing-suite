# Video Pipeline Workflow (Stub)
#
# Generates a video podcast with captions from the episode audio and SRT.
# This is a Phase 4 feature - currently a stub for the workflow structure.
#
# Future implementation will:
# 1. Download audio from Ghost media URL
# 2. Download episode artwork
# 3. Fetch SRT from S3 bucket
# 4. Generate static video with ffmpeg
# 5. Add SRT captions (burned in or soft subs)
# 6. Upload to YouTube via API

name: Generate Video Podcast

on:
  workflow_dispatch:
    inputs:
      guid:
        description: 'Episode GUID'
        required: true
        type: string
      ghost_slug:
        description: 'Ghost post slug'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-video:
    runs-on: ubuntu-latest
    outputs:
      youtube_id: ${{ steps.upload.outputs.youtube_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Stub - Future video generation
        id: generate
        run: |
          echo "=== VIDEO PIPELINE STUB ==="
          echo ""
          echo "This workflow will be implemented in Phase 4."
          echo ""
          echo "Planned steps:"
          echo "1. Fetch episode metadata from state file"
          echo "2. Download audio from Ghost media URL"
          echo "3. Download episode artwork"
          echo "4. Fetch SRT from S3: s3://bucket/transcripts/${{ inputs.guid }}/transcript.srt"
          echo "5. Generate static video with ffmpeg:"
          echo "   - Black background or artwork"
          echo "   - Audio waveform visualization"
          echo "   - Episode title overlay"
          echo "6. Add SRT captions (burned in for social, soft subs for YouTube)"
          echo "7. Upload to YouTube via API"
          echo ""
          echo "Episode GUID: ${{ inputs.guid }}"
          echo "Ghost Slug: ${{ inputs.ghost_slug }}"

          # Mark as not yet implemented
          echo "generated=false" >> $GITHUB_OUTPUT

      - name: Stub - Future YouTube upload
        id: upload
        run: |
          echo "=== YOUTUBE UPLOAD STUB ==="
          echo ""
          echo "YouTube upload will use:"
          echo "- YOUTUBE_CLIENT_ID secret"
          echo "- YOUTUBE_CLIENT_SECRET secret"
          echo "- YOUTUBE_REFRESH_TOKEN secret"
          echo ""
          echo "Title: Episode title from metadata"
          echo "Description: Episode description + link to Ghost post"
          echo "Tags: Podcast name, guest names, topics"
          echo ""

          # No video ID yet
          echo "youtube_id=" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Video Pipeline (Stub)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow is a placeholder for Phase 4 implementation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Episode GUID:** ${{ inputs.guid }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost Slug:** ${{ inputs.ghost_slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Video Generated:** ${{ steps.generate.outputs.generated }}" >> $GITHUB_STEP_SUMMARY
          echo "- **YouTube ID:** (not implemented)" >> $GITHUB_STEP_SUMMARY
