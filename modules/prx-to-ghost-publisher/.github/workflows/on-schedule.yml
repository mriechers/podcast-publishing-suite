# On Schedule Webhook Handler
#
# Triggered when a producer schedules a post in Ghost Admin.
# This workflow initiates downstream processing:
# - PRX write-back (update episode link to Ghost URL)
# - Video pipeline (generate video with captions)
# - Social automation (generate social post drafts)
#
# Webhook Setup:
# A Cloudflare Worker or similar endpoint receives the Ghost webhook
# and triggers this workflow via repository_dispatch.

name: Handle Ghost Post Scheduled

on:
  repository_dispatch:
    types: [post.scheduled]

  workflow_dispatch:
    inputs:
      ghost_post_id:
        description: 'Ghost post ID'
        required: true
        type: string
      ghost_slug:
        description: 'Ghost post slug'
        required: true
        type: string
      scheduled_for:
        description: 'Scheduled publication time (ISO 8601)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  handle-schedule:
    runs-on: ubuntu-latest
    outputs:
      guid: ${{ steps.lookup.outputs.guid }}
      ghost_slug: ${{ steps.lookup.outputs.ghost_slug }}
      ghost_url: ${{ steps.lookup.outputs.ghost_url }}
      srt_available: ${{ steps.lookup.outputs.srt_available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Extract post info from webhook
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # From Ghost webhook via Cloudflare Worker
            # Payload structure: { post: { id, slug, status, published_at } }
            GHOST_POST_ID='${{ github.event.client_payload.post.id }}'
            GHOST_SLUG='${{ github.event.client_payload.post.slug }}'
            SCHEDULED_FOR='${{ github.event.client_payload.post.published_at }}'
          else
            # From manual trigger
            GHOST_POST_ID='${{ inputs.ghost_post_id }}'
            GHOST_SLUG='${{ inputs.ghost_slug }}'
            SCHEDULED_FOR='${{ inputs.scheduled_for }}'
          fi

          echo "ghost_post_id=$GHOST_POST_ID" >> $GITHUB_OUTPUT
          echo "ghost_slug=$GHOST_SLUG" >> $GITHUB_OUTPUT
          echo "scheduled_for=$SCHEDULED_FOR" >> $GITHUB_OUTPUT

          echo "Processing scheduled post: $GHOST_SLUG (ID: $GHOST_POST_ID)"

      - name: Look up episode from state
        id: lookup
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
        run: |
          GHOST_POST_ID="${{ steps.extract.outputs.ghost_post_id }}"
          GHOST_SLUG="${{ steps.extract.outputs.ghost_slug }}"
          GHOST_URL="${GHOST_URL}"

          # Look up episode GUID from state file by Ghost post ID
          python3 << EOF
          import json
          from pathlib import Path

          state_file = Path('data/published_episodes.prod.json')
          if not state_file.exists():
              print('State file not found')
              exit(1)

          with open(state_file) as f:
              state = json.load(f)

          # Remove metadata key
          state.pop('_metadata', None)

          # Find episode by Ghost post ID
          found_guid = None
          episode_data = None
          for guid, data in state.items():
              if data.get('ghost_post_id') == '$GHOST_POST_ID':
                  found_guid = guid
                  episode_data = data
                  break

          if not found_guid:
              print(f'No episode found for Ghost post ID: $GHOST_POST_ID')
              exit(1)

          # Build Ghost post URL
          ghost_url = '${GHOST_URL}'.rstrip('/')
          post_url = f'{ghost_url}/{episode_data.get("ghost_slug", "$GHOST_SLUG")}/'

          # Output values
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'guid={found_guid}\n')
              f.write(f'ghost_slug={episode_data.get("ghost_slug", "$GHOST_SLUG")}\n')
              f.write(f'ghost_url={post_url}\n')
              f.write(f'srt_available={str(episode_data.get("srt_available", False)).lower()}\n')
              f.write(f'title={episode_data.get("title", "")}\n')

          print(f'Found episode: {found_guid}')
          print(f'Ghost URL: {post_url}')
          print(f'SRT available: {episode_data.get("srt_available", False)}')
          EOF

      - name: Update episode status to scheduled
        run: |
          python3 << EOF
          import sys
          sys.path.insert(0, '.')

          from pathlib import Path
          from src.config import get_config
          from src.state_tracker import StateTracker

          config = get_config(env_name='prod')
          tracker = StateTracker(config.state_file)

          guid = "${{ steps.lookup.outputs.guid }}"
          tracker.update_status(guid, 'scheduled')
          print(f'Updated status to scheduled for: {guid}')
          EOF

      - name: Commit status update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/published_episodes.prod.json

          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: Mark ${{ steps.lookup.outputs.guid }} as scheduled

            [Agent: GitHub Actions]

            Scheduled for: ${{ steps.extract.outputs.scheduled_for }}

            Co-Authored-By: GitHub Actions <noreply@github.com>"

            git push
          fi

      - name: Summary
        run: |
          echo "## Post Scheduled Event" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Episode GUID:** ${{ steps.lookup.outputs.guid }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost Post ID:** ${{ steps.extract.outputs.ghost_post_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost Slug:** ${{ steps.lookup.outputs.ghost_slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost URL:** ${{ steps.lookup.outputs.ghost_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheduled For:** ${{ steps.extract.outputs.scheduled_for }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SRT Available:** ${{ steps.lookup.outputs.srt_available }}" >> $GITHUB_STEP_SUMMARY

  # Trigger downstream workflows in parallel
  trigger-prx-writeback:
    needs: handle-schedule
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PRX write-back
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Triggering PRX write-back workflow');

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'prx-writeback.yml',
              ref: 'main',
              inputs: {
                guid: '${{ needs.handle-schedule.outputs.guid }}',
                ghost_url: '${{ needs.handle-schedule.outputs.ghost_url }}'
              }
            });

  trigger-video-pipeline:
    needs: handle-schedule
    if: needs.handle-schedule.outputs.srt_available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger video pipeline
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Triggering video pipeline workflow');

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'video-pipeline.yml',
              ref: 'main',
              inputs: {
                guid: '${{ needs.handle-schedule.outputs.guid }}',
                ghost_slug: '${{ needs.handle-schedule.outputs.ghost_slug }}'
              }
            });

  trigger-social-automation:
    needs: handle-schedule
    runs-on: ubuntu-latest
    steps:
      - name: Trigger social automation
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Triggering social automation workflow');

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'social-automation.yml',
              ref: 'main',
              inputs: {
                guid: '${{ needs.handle-schedule.outputs.guid }}',
                ghost_slug: '${{ needs.handle-schedule.outputs.ghost_slug }}',
                ghost_url: '${{ needs.handle-schedule.outputs.ghost_url }}'
              }
            });
