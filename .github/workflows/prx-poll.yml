# PRX Dovetail Polling Workflow
#
# Polls the PRX Dovetail API every 30 minutes to detect new episodes.
# When new episodes are found, triggers the episode-import workflow.
#
# This is the primary entry point for the automation pipeline.

name: Poll PRX for New Episodes

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'

  workflow_dispatch:
    inputs:
      guid:
        description: 'Specific episode GUID to import (optional)'
        required: false
        type: string
      podcast_id:
        description: 'Podcast ID to poll (default: all configured)'
        required: false
        type: string
      dry_run:
        description: 'Dry run mode (detect but do not import)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  poll-for-episodes:
    runs-on: ubuntu-latest
    outputs:
      new_episodes: ${{ steps.detect.outputs.new_episodes }}
      episode_count: ${{ steps.detect.outputs.episode_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Detect new episodes
        id: detect
        env:
          GHOST_URL: ${{ secrets.GHOST_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          PRX_CLIENT_ID: ${{ secrets.PRX_CLIENT_ID }}
          PRX_CLIENT_SECRET: ${{ secrets.PRX_CLIENT_SECRET }}
          PRX_PODCAST_IDS: ${{ secrets.PRX_PODCAST_IDS }}
          PRX_FEED_URL: ${{ secrets.PRX_FEED_URL }}
        run: |
          # Build command with optional GUID filter
          CMD="python -m src.main --env prod sync --source api --dry-run --json-output --yes"

          if [ -n "${{ inputs.guid }}" ]; then
            CMD="$CMD --guid ${{ inputs.guid }}"
          fi

          echo "Running: $CMD"
          OUTPUT=$($CMD) || true

          echo "CLI Output: $OUTPUT"

          # Parse JSON output to extract new episodes
          NEW_EPISODES=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Extract episodes that would be published (not skipped)
              new = data.get('new_episodes', [])
              print(json.dumps(new))
          except:
              print('[]')
          ")

          EPISODE_COUNT=$(echo "$NEW_EPISODES" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")

          echo "new_episodes=$NEW_EPISODES" >> $GITHUB_OUTPUT
          echo "episode_count=$EPISODE_COUNT" >> $GITHUB_OUTPUT

          echo "Found $EPISODE_COUNT new episode(s)"

      - name: Summary
        run: |
          echo "## PRX Poll Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **New Episodes Found:** ${{ steps.detect.outputs.episode_count }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "- **Mode:** Dry Run (no import triggered)" >> $GITHUB_STEP_SUMMARY
          fi

  # Trigger import for each new episode
  trigger-imports:
    needs: poll-for-episodes
    if: needs.poll-for-episodes.outputs.episode_count > 0 && inputs.dry_run != true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        episode: ${{ fromJson(needs.poll-for-episodes.outputs.new_episodes) }}
      max-parallel: 1  # Import one at a time to avoid state file conflicts

    steps:
      - name: Trigger episode import
        uses: actions/github-script@v7
        with:
          script: |
            const episode = ${{ toJson(matrix.episode) }};
            console.log(`Triggering import for: ${episode.title} (${episode.guid})`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'episode-import.yml',
              ref: 'main',
              inputs: {
                guid: episode.guid,
                title: episode.title,
                podcast_id: episode.podcast_id || ''
              }
            });

            console.log(`Import triggered for ${episode.guid}`);
