# Social Automation Workflow (Stub)
#
# Generates social post drafts for producer approval.
# This is a Phase 4 feature - currently a stub for the workflow structure.
#
# Future implementation will:
# 1. Get episode metadata (title, description, guest, topics)
# 2. Generate social post variations using OpenAI or templates
# 3. Queue drafts in Airtable for producer approval
# 4. Notify via Slack when drafts are ready

name: Generate Social Posts

on:
  workflow_dispatch:
    inputs:
      guid:
        description: 'Episode GUID'
        required: true
        type: string
      ghost_slug:
        description: 'Ghost post slug'
        required: true
        type: string
      ghost_url:
        description: 'Ghost post URL'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  generate-social:
    runs-on: ubuntu-latest
    outputs:
      drafts_created: ${{ steps.generate.outputs.drafts_created }}
      airtable_record_id: ${{ steps.queue.outputs.record_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stub - Future social post generation
        id: generate
        run: |
          echo "=== SOCIAL AUTOMATION STUB ==="
          echo ""
          echo "This workflow will be implemented in Phase 4."
          echo ""
          echo "Planned steps:"
          echo "1. Fetch episode metadata from state file"
          echo "2. Extract key information:"
          echo "   - Episode title"
          echo "   - Guest name(s)"
          echo "   - Key topics/themes"
          echo "   - Notable quotes"
          echo "3. Generate social post variations:"
          echo "   - Twitter/X (280 chars)"
          echo "   - Facebook (longer form)"
          echo "   - Instagram caption"
          echo "   - LinkedIn professional angle"
          echo "4. Include Ghost post URL: ${{ inputs.ghost_url }}"
          echo ""
          echo "Episode GUID: ${{ inputs.guid }}"
          echo "Ghost Slug: ${{ inputs.ghost_slug }}"

          # Mark as not yet implemented
          echo "drafts_created=0" >> $GITHUB_OUTPUT

      - name: Stub - Future Airtable queue
        id: queue
        run: |
          echo "=== AIRTABLE QUEUE STUB ==="
          echo ""
          echo "Airtable integration will:"
          echo "1. Create record in Social Posts table"
          echo "2. Include all post variations"
          echo "3. Set status to 'Pending Review'"
          echo "4. Link to episode record"
          echo ""
          echo "Will use AIRTABLE_API_KEY secret"
          echo ""

          # No record ID yet
          echo "record_id=" >> $GITHUB_OUTPUT

      - name: Stub - Future Slack notification
        run: |
          echo "=== SLACK NOTIFICATION STUB ==="
          echo ""
          echo "Slack notification will:"
          echo "1. Post to configured channel"
          echo "2. Include episode title and link"
          echo "3. Link to Airtable record for approval"
          echo ""
          echo "Will use SLACK_BOT_TOKEN and SLACK_CHANNEL_ID secrets"

      - name: Record social queued (stub)
        run: |
          echo "Would record social_queued=true for ${{ inputs.guid }}"
          echo "(Not implemented in stub)"

      - name: Summary
        run: |
          echo "## Social Automation (Stub)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow is a placeholder for Phase 4 implementation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Episode GUID:** ${{ inputs.guid }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost Slug:** ${{ inputs.ghost_slug }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ghost URL:** ${{ inputs.ghost_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Drafts Created:** ${{ steps.generate.outputs.drafts_created }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Airtable Record:** (not implemented)" >> $GITHUB_STEP_SUMMARY
