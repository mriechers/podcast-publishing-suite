[project]
name = "prx-to-ghost-publisher"
version = "0.1.0"
description = "Sync PRX/Dovetail podcast episodes to Ghost CMS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Wisconsin Public Radio"}
]
keywords = ["podcast", "ghost", "cms", "prx", "rss"]

dependencies = [
    "pyjwt>=2.8.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "nh3>=0.2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-vcr>=1.0.0",
]

[project.scripts]
prx-to-ghost = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
